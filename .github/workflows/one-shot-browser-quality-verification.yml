name: one-shot browser quality verification
on:
  push:
    branches: [feat/profit-first-experience]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start app
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/ec-pulse-uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/ >/dev/null
      - name: Browser interaction audit
        run: |
          cat > /tmp/browser_audit.py <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          
          widths = [390, 820, 1366]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for width in widths:
                  page = browser.new_page(viewport={"width": width, "height": 900})
                  errors = []
                  page.on("console", lambda msg: errors.append(msg.text) if msg.type == "error" else None)
                  page.on("pageerror", lambda exc: errors.append(str(exc)))
                  page.goto("http://127.0.0.1:8000/", wait_until="networkidle")
                  assert page.title().startswith("EC Pulse API")
                  assert page.locator(".skip-link").count() == 1
                  assert page.locator("#engine").count() == 1
                  assert page.locator("#flow").count() == 1
                  assert page.locator("[data-engine='3']").count() == 1
                  assert page.locator("[data-radar='1']").count() == 1
                  assert page.locator("#profit-verdict").inner_text().startswith("仕入れ余地あり")
                  assert page.locator("body").evaluate("(el) => el.scrollWidth <= el.clientWidth + 1")
                  page.locator("[data-engine='3']").click()
                  assert page.locator("#engine-result-title").inner_text() == "機会を逃さない理由"
                  page.locator("[data-radar='1']").click()
                  assert page.locator("#radar-name").inner_text() == "レビュー改善型アクセサリ"
                  page.locator("#sale-price").fill("1000")
                  page.locator("#margin-rate").fill("90")
                  assert "条件を見直してください" in page.locator("#profit-verdict").inner_text()
                  assert not errors, f"console/page errors at width {width}: {errors}"
                  page.close()
              browser.close()
          print("browser audit PASS: 390/820/1366, keyboard-target DOM, radar, engine, calculator, no overflow, no console errors")
          PY
          python /tmp/browser_audit.py
