name: monitor-cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-monitors:
    runs-on: ubuntu-latest
    steps:
      - name: Check due monitors
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_BASE_URL: ${{ secrets.EC_PULSE_API_URL || 'https://ec-pulse-api.vercel.app' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not configured" >&2
            exit 1
          fi
          if [ -z "${API_BASE_URL}" ]; then
            echo "EC_PULSE_API_BASE_URL is not configured" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 30 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${API_BASE_URL%/}/api/cron/check-monitors"
